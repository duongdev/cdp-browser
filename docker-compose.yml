services:
  cdp-web:
    build: .
    image: cdp-browser-web:latest
    container_name: cdp-browser-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7800}:7800"
    environment:
      # Remote CDP host the proxy connects to (LAN or Tailscale IP/hostname).
      # Must be an IP/localhost (CDP rejects DNS Host headers).
      CDP_HOST: ${CDP_HOST:-host.docker.internal}
      CDP_PORT: ${CDP_PORT:-9222}
      PORT: "7800"
      APP_TITLE: ${APP_TITLE:-CDP Browser}
      # All stateful files default under DATA_DIR (t163) — chat DB, pins/history, push subs, Slack
      # state — so a redeploy on the mounted volume keeps folders/labels/read-state. The two legacy
      # paths keep their existing /data filenames.
      DATA_DIR: /data
      SETTINGS_PATH: /data/settings.json
      NOTIFS_PATH: /data/notifications.json
      # Optional E2E payload encryption. Set E2E_PASSPHRASE to turn it on (else plaintext).
      # E2E_SALT (base64) keeps the key stable across restarts; omit for a per-boot salt.
      E2E_PASSPHRASE: ${E2E_PASSPHRASE:-}
      E2E_SALT: ${E2E_SALT:-}
      # BFF (chat-server) shared secret — the /internal/teams/* guard checks this header.
      # REQUIRED in prod: set a strong random value (e.g. openssl rand -hex 32).
      CHAT_INTERNAL_SECRET: ${CHAT_INTERNAL_SECRET:-dev-internal-secret}
      # VAPID keys for Teams web push. Use the SAME keys server.mjs Teams push used so
      # already-installed PWA subscriptions survive the migration (don't regenerate).
      # Generate once: node -e "const {generateVAPIDKeys: g}=require('web-push'); console.log(g())"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Hermes agent backend for the assistant panel (ADR-0028). Both must be set for the
      # panel's turn route to use the agent; with either unset, chat-server's own loop
      # serves turns exactly as before, so this is safe to leave empty.
      # HERMES_API_URL is the gateway's TAILNET address — never a public origin.
      # HERMES_API_KEY grants an unsandboxed shell on the gateway host: it stays in the
      # server process, is never sent to the browser, and belongs in Dokploy's env, not git.
      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
    volumes:
      - cdp-web-data:/data
    # Bridge networking NATs out to the host's LAN, so a LAN CDP_HOST (e.g.
    # 192.168.x.x) works as-is. `host.docker.internal` resolves to the host via
    # the mapping below. For a Tailscale (100.x) CDP host, either ensure the
    # host's tailnet routes into the container or switch to `network_mode: host`
    # (Linux only) and drop the ports/extra_hosts blocks.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cdp-web-data:
